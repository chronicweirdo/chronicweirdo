<!DOCTYPE html>

<html>
<head>
    <script>
        function clear() {
            var s = document.getElementById("star")
            s.innerHTML = ''
        }
        function line(x1, y1, x2, y2) {
            var newLine = document.createElementNS('http://www.w3.org/2000/svg','line');
            //newLine.setAttribute('id','line' + Date.now());
            newLine.setAttribute('x1', x1);
            newLine.setAttribute('y1', y1);
            newLine.setAttribute('x2', x2);
            newLine.setAttribute('y2', y2);
            document.getElementById("star").appendChild(newLine)
        }
        function point(x, y) {
            var point = document.createElementNS('http://www.w3.org/2000/svg','circle')
            point.setAttribute('id','point' + Date.now());
            point.setAttribute('r', 2)
            point.setAttribute('cx', x)
            point.setAttribute('cy', y)
            point.setAttribute('fill', 'black')
            document.getElementById("star").appendChild(point)
        }
        function getCirclePoints(cx, cy, cr, np, translation) {
            let translation_radians = translation * (Math.PI / 180)
            let points = []
            for (let i = 0; i < np; i++) {
                xi = cx + cr * Math.cos(translation_radians + (2 * Math.PI * i) / np)
                yi = cy + cr * Math.sin(translation_radians + (2 * Math.PI * i) / np)
                points.push([xi, yi])
            }
            return points
        }
        function getPoliDistribution(pointsNum, step) {
            let pol = new Array(pointsNum).fill(0)
            let res = []
            let currentpol = []
            let assigned = 0
            let polNum = 1
            while (assigned < pointsNum) {
                let current = 0
                while (pol[current] != 0) {
                    current += 1
                }
                pol[current] = polNum
                currentpol.push(current)
                assigned += 1
                current = (current + step) % pointsNum
                while (pol[current] == 0) {
                    pol[current] = polNum
                    currentpol.push(current)
                    assigned += 1
                    current = (current + step) % pointsNum
                }
                polNum += 1
                res.push(currentpol)
                currentpol = []
            }
            return res
        }
        function getPolis(points, jump) {
            let poliDistribution = getPoliDistribution(points.length, jump)
            return poliDistribution.map(pdl =>
                pdl.map(p => points[p])
            )
        }
        function closedPoli(points) {
            for (let i = 0; i < points.length - 1; i++) {
                line(points[i][0], points[i][1], points[i+1][0], points[i+1][1])
            }
            line(points[points.length-1][0], points[points.length-1][1], points[0][0], points[0][1])
        }
        function updateStepRange() {
            let pointNum = +document.getElementById("pointsRange").value
            let stepRange = document.getElementById("stepRange")
            let step = +stepRange.value
            stepRange.setAttribute("max", pointNum - 1)
            if (step > pointNum-1) {
                stepRange.value = pointNum-1
            }
            drawStar()
        }
        function drawStar() {
            clear()
            let pointNum = +document.getElementById("pointsRange").value
            let step = +document.getElementById("stepRange").value
            let points = getCirclePoints(100, 100, 90, pointNum, -90)
            let polis = getPolis(points, step)
            for (let pi = 0; pi < polis.length; pi++) {
                closedPoli(polis[pi])
            }
        }
        function updateLineColor() {
            let color = document.getElementById("lineColor").value
            document.documentElement.style.setProperty('--line-color', color)
        }
        function updateBackColor() {
            let color = document.getElementById("backColor").value
            document.documentElement.style.setProperty('--back-color', color)
        }
        function downloadSVG() {
            const svg = document.getElementById('star').outerHTML;
            const blob = new Blob([svg.toString()]);
            const element = document.createElement("a");
            element.download = "star.svg";
            element.href = window.URL.createObjectURL(blob);
            element.click();
            element.remove();
        }
        function sizing() {
            let w = document.documentElement.clientWidth
            let h = document.documentElement.clientHeight
            let s = w
            if (w > h) {
                s = h
            }
            s = s * 0.8
            const svg = document.getElementById('star')
            svg.width = s + 'px'
            svg.height = s + 'px'
            document.getElementById('star').setAttribute("width", s)
            document.getElementById('star').setAttribute("height", s)
        }
    </script>
    <style>
        :root {
            --line-color: #d01717;
            --back-color: #111111;
        }
        body {
            background-color: var(--back-color);  
        }
        div {
            text-align: center;
        }
        input {
            display: block;
            width: 80vw;
            margin: auto;
            text-align: center;
            margin-bottom: 1em;
            height: 5vh;
        }
        input[type=color] {
            display: inline-block;
            width: 80vw;
            height: 5vh;
        }
        svg {
            display: block;
            width: 80vw;
            margin: auto;
            text-align: center;
            margin-bottom: 1em;
        }
        line {
            stroke: var(--line-color);
        }
    </style>
</head>
<body>
    <div>
        <input onchange="updateStepRange()" type="range" min="4" max="20" value="13" class="slider" id="pointsRange">
        <input onchange="drawStar()" type="range" min="1" max="12" value="4" class="slider" id="stepRange">
        <input onchange="updateBackColor()" type="color" id="backColor" name="backcolor" value="#000000">
        <input onchange="updateLineColor()" type="color" id="lineColor" name="linecolor" value="#ff0000">
    </div>
    <svg width="200" height="200" viewBox="0 0 200 200" id="star" xmlns="http://www.w3.org/2000/svg"></svg>
    <script>
        sizing()
        updateStepRange()
    </script>
</body>
</html>
